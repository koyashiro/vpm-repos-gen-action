name: test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Test(latest)
        uses: ./
        with:
          output: "repos.json"

      - name: Test(v2.2.0)
        uses: ./
        with:
          version: "2.2.0"
          name: "koyashiro"
          id: "net.koyashiro.vpm"
          url: "https://vpm.koyashiro.net/repos.json"
          author: "koyashiro"
          repos: |
            koyashiro/udon-list
            koyashiro/udon-dictionary
            koyashiro/udon-json
          output: "-"

      - name: Test(v2.2.0)
        uses: ./
        with:
          version: "2.2.0"
          name: "koyashiro"
          id: "net.koyashiro.vpm"
          url: "https://vpm.koyashiro.net/repos.json"
          author: "koyashiro"
          repos: koyashiro/udon-list,koyashiro/udon-dictionary,koyashiro/udon-json
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output: "-"
